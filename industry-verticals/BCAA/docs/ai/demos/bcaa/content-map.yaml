    {
      "position": 4,
      "componentName": "HeadingCta",
      "manifestName": "HeadingCta",
      "kind": "simple",
      "datasourceItemName": "BCAA - intro",
      "fields": {
        "Heading": {
          "value": "Moving British Columbians Forward"
        },
        "Text": {
          "value": "From help at home to on the move, we keep British Columbians moving forward with proven protection and mobility solutions, including Membership, Insurance, Auto Service and Evo. Plus, as a BCAA Member, you can save over $1,500 a year on everyday essentials, insurance, experiences, travel, dining out and more! That’s the power of BCAA, and it’s moving British Columbians forward. Join the movement today!"
        }
      },
      "children": [],
      "imageFields": [],
      "params": {
        "styles": "bcaa-intro",
        "RenderingIdentifier": "intro"
      },
      "source": "https://www.bcaa.com/"
