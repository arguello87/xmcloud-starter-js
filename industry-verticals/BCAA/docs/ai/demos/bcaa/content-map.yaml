      "kind": "list",
      "datasourceItemName": "BCAA - hero",
      "fields": {
        "items": [
          {
            "id": "bcaa-slide-0",
            "fields": {
              "Title": {
                "value": "Car Insurance Made Easy"
              },
              "Text": {
                "value": "<p>Simply give us a call, visit us in-person or renew online if you’re eligible.</p>"
              },
              "Image": {
                "value": {
                  "src": "https://www.bcaa.com/-/media/bcaa/images/home-page-carousel/desktop/080-26_rew_accelerate_auto_ban_2560x900_st.jpg?sc_lang=en",
                  "alt": "Drive with peace of mind"
                }
              },
              "Link": {
                "value": {
                  "text": "Renew ICBC",
                  "href": "https://www.bcaa.com/insurance/car"
                }
              }
            }
          },
          {
            "id": "bcaa-slide-1",
            "fields": {
              "Title": {
                "value": "Wear the wildflower that defends against wildfires"
              },
              "Text": {
                "value": "<p>The BCAA Fireweed Pin celebrates our strength in the face of wildfires. Get yours today and help support wildfire resilience efforts across BC.</p>"
              },
              "Image": {
                "value": {
                  "src": "https://www.bcaa.com/-/media/bcaa/images/home-page-carousel/desktop/151-26_cmi_fireweed_greenshirt_hro_2560x900.jpg?sc_lang=en",
                  "alt": "Drive with peace of mind"
                }
              },
              "Link": {
                "value": {
                  "text": "Learn more",
                  "href": "https://www.bcaa.com/impact/wildfire-resilience/fireweed"
                }
              }
            }
          },
          {
            "id": "bcaa-slide-2",
            "fields": {
              "Title": {
                "value": "Manage your products in one place"
              },
              "Text": {
                "value": "<p>Everything you need is at your fingertips. Manage a renewal, find your documents, download a digital wallet card or start a claim in myBCAA.</p>"
              },
              "Image": {
                "value": {
                  "src": "https://www.bcaa.com/-/media/bcaa/images/home-page-carousel/desktop/288-25_xsl_mybcaa_phoneman_hro_2560x900.jpg?sc_lang=en",
                  "alt": "Drive with peace of mind"
                }
              },
              "Link": {
                "value": {
                  "text": "Login",
                  "href": "https://www.bcaa.com/login"
                }
              }
            }
          },
          {
            "id": "bcaa-slide-3",
            "fields": {
              "Title": {
                "value": "Join BC’s online community, BCAA Connect!"
              },
              "Text": {
                "value": "<p>Swap tips, ask questions and connect with others in your trusted space to share life in BC.</p>"
              },
              "Image": {
                "value": {
                  "src": "https://www.bcaa.com/-/media/bcaa/images/home-page-carousel/desktop/bcaa-connect-hero_2560x900.jpg?sc_lang=en",
                  "alt": "Drive with peace of mind"
                }
              },
              "Link": {
                "value": {
                  "text": "Sign in",
                  "href": "https://www.bcaa.com/bcaa-connect"
                }
              }
            }
          },
          {
            "id": "bcaa-slide-4",
            "fields": {
              "Title": {
                "value": "Let’s GO!"
              },
              "Text": {
                "value": "<p>A BCAA GO Membership is your ticket to unlocking sweet perks to help you make the most of life in BC. Save over $1,000/year on the everyday, Evo & more!</p>"
              },
              "Image": {
                "value": {
                  "src": "https://www.bcaa.com/-/media/bcaa/images/home-page-carousel/desktop/162-23_mem_newtiergo_webbg_2048x1536.jpg",
                  "alt": "Drive with peace of mind"
                }
              },
              "Link": {
                "value": {
                  "text": "Sign up",
                  "href": "https://www.bcaa.com/membership/go"
                }
              }
            }
          }
        ]
      },
